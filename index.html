<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="robots" content="noindex, nofollow">
    <title>Control financiero</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">

    <style>
      :root {
        --azul: #2563eb;
        --azul-oscuro: #1e40af;
        --indigo: #4f46e5;
        --fondo: #eef2ff;
        --texto: #172033;
        --borde: #d7ddea;
        --blanco: #fff;
        --exito: #15803d;
        --error: #b42318;
      }

      * { box-sizing: border-box; }

      html { min-height: 100%; background: var(--fondo); }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: max(14px, env(safe-area-inset-top)) 14px
          max(20px, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at top left, #dbeafe 0, transparent 38%),
          radial-gradient(circle at top right, #e0e7ff 0, transparent 42%),
          var(--fondo);
        color: var(--texto);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .app { width: 100%; max-width: 560px; margin: 0 auto; }

      .sin-conexion {
        display: none;
        margin: 0 0 12px;
        padding: 11px 15px;
        border-radius: 14px;
        background: var(--error);
        color: var(--blanco);
        font-size: 14px;
        font-weight: 750;
        text-align: center;
      }

      .sin-conexion.visible { display: block; }

      .tarjeta {
        overflow: hidden;
        background: rgba(255, 255, 255, 0.97);
        border-radius: 28px;
        box-shadow: 0 20px 55px rgba(30, 64, 175, 0.16);
      }

      header {
        padding: 24px 22px 22px;
        background: linear-gradient(135deg, var(--azul), var(--indigo));
        color: var(--blanco);
      }

      .encabezado { display: flex; align-items: center; gap: 14px; }

      .icono {
        display: grid;
        width: 56px;
        height: 56px;
        flex: 0 0 56px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.18);
        font-size: 29px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: clamp(27px, 7vw, 36px);
        line-height: 1.05;
        letter-spacing: -0.7px;
      }

      .subtitulo {
        margin: 7px 0 0;
        color: rgba(255, 255, 255, 0.82);
        font-size: 16px;
      }

      .contenido { padding: 22px; }
      .grupo { margin-bottom: 18px; }

      label {
        display: block;
        margin: 0 0 8px;
        font-size: 15px;
        font-weight: 750;
      }

      input, select, textarea, button { width: 100%; font: inherit; }

      input, select, textarea {
        border: 1.5px solid var(--borde);
        border-radius: 15px;
        background: #f8fafc;
        color: var(--texto);
        font-size: 18px;
      }

      input, select { min-height: 58px; padding: 0 16px; }
      textarea { min-height: 112px; padding: 15px 16px; resize: vertical; }

      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--azul);
        background: var(--blanco);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.13);
      }

      select:disabled { background: #eef1f6; color: #98a2b3; }
      .monto { position: relative; }

      .peso {
        position: absolute;
        top: 50%;
        left: 16px;
        transform: translateY(-50%);
        color: var(--azul-oscuro);
        font-size: 21px;
        font-weight: 800;
        pointer-events: none;
      }

      #monto { padding-left: 43px; font-size: 22px; font-weight: 750; }

      button {
        min-height: 62px;
        margin-top: 4px;
        border: 0;
        border-radius: 17px;
        background: linear-gradient(135deg, var(--azul), var(--indigo));
        color: var(--blanco);
        font-size: 18px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(37, 99, 235, 0.25);
      }

      button:active { transform: scale(0.98); }
      button:disabled { cursor: wait; opacity: 0.62; }

      #mensaje {
        min-height: 24px;
        margin: 16px 0 0;
        text-align: center;
        font-size: 15px;
        font-weight: 750;
      }

      .exito { color: var(--exito); }
      .error { color: var(--error); }
      .cargando { color: var(--azul-oscuro); }

      @media (min-width: 700px) {
        body { display: flex; align-items: center; padding: 32px; }
        header, .contenido { padding-right: 30px; padding-left: 30px; }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <p id="avisoConexion" class="sin-conexion">
        Sin conexión a Internet. No se pueden guardar movimientos.
      </p>

      <main class="tarjeta">
        <header>
          <div class="encabezado">
            <div class="icono" aria-hidden="true">$</div>
            <div>
              <h1>Control financiero</h1>
              <p class="subtitulo">Registra tus gastos e ingresos</p>
            </div>
          </div>
        </header>

        <div class="contenido">
          <form id="formulario" autocomplete="off">
            <div class="grupo">
              <label for="fecha">Fecha</label>
              <input id="fecha" type="date" required>
            </div>

            <div class="grupo">
              <label for="tipo">Tipo de movimiento</label>
              <select id="tipo" required>
                <option value="">Selecciona una opción</option>
                <option value="Gasto">Gasto</option>
                <option value="Ingreso">Ingreso</option>
              </select>
            </div>

            <div class="grupo">
              <label for="monto">Monto</label>
              <div class="monto">
                <span class="peso">$</span>
                <input id="monto" type="number" min="0.01" step="0.01"
                  inputmode="decimal" placeholder="0.00" required>
              </div>
            </div>

            <div class="grupo">
              <label for="categoria">Categoría</label>
              <select id="categoria" required disabled>
                <option value="">Primero selecciona un tipo</option>
              </select>
            </div>

            <div class="grupo">
              <label for="cuenta">Cuenta</label>
              <select id="cuenta" required disabled>
                <option value="">Cargando cuentas...</option>
              </select>
            </div>

            <div class="grupo">
              <label for="descripcion">Descripción</label>
              <textarea id="descripcion" maxlength="200"
                placeholder="¿En qué gastaste o de dónde recibiste el dinero?"></textarea>
            </div>

            <button id="botonGuardar" type="submit">Guardar movimiento</button>
          </form>

          <p id="mensaje" role="status" aria-live="polite"></p>
        </div>
      </main>
    </div>

    <script>
      const API_URL = 'https://script.google.com/macros/s/' +
        'AKfycbxHnonXJiFWvP1VywXQGyF6ndcTgPaT1wdnJUSXUsBS5Lu-8LubkJRakY5QhJfp3-0UbQ/' +
        'exec';

      const formulario = document.getElementById('formulario');
      const fecha = document.getElementById('fecha');
      const tipo = document.getElementById('tipo');
      const monto = document.getElementById('monto');
      const categoria = document.getElementById('categoria');
      const cuenta = document.getElementById('cuenta');
      const descripcion = document.getElementById('descripcion');
      const mensaje = document.getElementById('mensaje');
      const botonGuardar = document.getElementById('botonGuardar');
      const avisoConexion = document.getElementById('avisoConexion');

      let opciones = null;

      document.addEventListener('DOMContentLoaded', function () {
        establecerFechaActual();
        actualizarConexion();
        cargarOpciones();
      });

      window.addEventListener('online', function () {
        actualizarConexion();
        if (!opciones) cargarOpciones();
      });
      window.addEventListener('offline', actualizarConexion);

      function establecerFechaActual() {
        const hoy = new Date();
        const año = hoy.getFullYear();
        const mes = String(hoy.getMonth() + 1).padStart(2, '0');
        const día = String(hoy.getDate()).padStart(2, '0');
        fecha.value = año + '-' + mes + '-' + día;
      }

      function actualizarConexion() {
        avisoConexion.classList.toggle('visible', !navigator.onLine);
      }

      function mostrarMensaje(texto, clase) {
        mensaje.textContent = texto;
        mensaje.className = clase;
      }

      function llenarSelector(selector, valores, textoInicial) {
        selector.innerHTML = '';
        const primera = document.createElement('option');
        primera.value = '';
        primera.textContent = textoInicial;
        selector.appendChild(primera);

        valores.forEach(function (valor) {
          const opcion = document.createElement('option');
          opcion.value = valor;
          opcion.textContent = valor;
          selector.appendChild(opcion);
        });
      }

      async function cargarOpciones() {
        if (!navigator.onLine) {
          mostrarMensaje('Conéctate a Internet para cargar las opciones.', 'error');
          return;
        }

        mostrarMensaje('Cargando categorías y cuentas...', 'cargando');

        try {
          const respuesta = await solicitarJsonp({ accion: 'opciones' });
          if (!respuesta.correcto) {
            throw new Error(respuesta.mensaje || 'No se recibieron las opciones.');
          }

          opciones = respuesta.datos;
          llenarSelector(cuenta, opciones.cuentas, 'Selecciona una cuenta');
          cuenta.disabled = false;
          mostrarMensaje('', '');
        } catch (error) {
          mostrarMensaje('No se pudieron cargar las opciones: ' + error.message, 'error');
        }
      }

      tipo.addEventListener('change', function () {
        if (!opciones) return;
        const lista = opciones.categorias[tipo.value] || [];
        llenarSelector(categoria, lista, 'Selecciona una categoría');
        categoria.disabled = lista.length === 0;
      });

      function cambiarEstadoGuardado(guardando) {
        botonGuardar.disabled = guardando;
        botonGuardar.textContent = guardando ? 'Guardando...' : 'Guardar movimiento';
      }

      function crearIdSolicitud() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        return Date.now().toString(36) + '-' +
          Math.random().toString(36).slice(2) + '-' +
          Math.random().toString(36).slice(2);
      }

      function esperar(ms) {
        return new Promise(function (resolve) { window.setTimeout(resolve, ms); });
      }

      function solicitarJsonp(parametros, limiteMs = 20000) {
        return new Promise(function (resolve, reject) {
          const callback = '__finanzas_' + Date.now() + '_' +
            Math.random().toString(36).slice(2);
          const script = document.createElement('script');
          let terminado = false;

          const temporizador = window.setTimeout(function () {
            limpiar();
            reject(new Error('La respuesta de Google tardó demasiado.'));
          }, limiteMs);

          function limpiar() {
            if (terminado) return;
            terminado = true;
            window.clearTimeout(temporizador);
            delete window[callback];
            script.remove();
          }

          window[callback] = function (respuesta) {
            limpiar();
            resolve(respuesta);
          };

          script.onerror = function () {
            limpiar();
            reject(new Error('Google no respondió correctamente.'));
          };

          const consulta = new URLSearchParams({
            ...parametros,
            prefix: callback,
            _: String(Date.now())
          });
          script.src = API_URL + '?' + consulta.toString();
          document.body.appendChild(script);
        });
      }

      async function consultarEstado(id) {
        for (let intento = 0; intento < 15; intento += 1) {
          await esperar(900);
          const estado = await solicitarJsonp(
            { accion: 'estado', id: id },
            12000
          );
          if (estado.listo) return estado;
        }
        throw new Error('No se pudo confirmar el registro.');
      }

      async function enviarMovimiento(datos) {
        const id = crearIdSolicitud();
        const cuerpo = new URLSearchParams({ accion: 'guardar', id: id, ...datos });

        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          credentials: 'omit',
          body: cuerpo
        });

        return consultarEstado(id);
      }

      formulario.addEventListener('submit', async function (evento) {
        evento.preventDefault();
        if (!navigator.onLine) {
          mostrarMensaje('No hay conexión a Internet.', 'error');
          return;
        }

        const datos = {
          fecha: fecha.value,
          tipo: tipo.value,
          monto: monto.value,
          categoria: categoria.value,
          cuenta: cuenta.value,
          descripcion: descripcion.value.trim()
        };

        cambiarEstadoGuardado(true);
        mostrarMensaje('Guardando movimiento...', 'cargando');

        try {
          const respuesta = await enviarMovimiento(datos);
          if (!respuesta.correcto) {
            throw new Error(respuesta.mensaje || 'No se pudo guardar.');
          }

          mostrarMensaje(
            respuesta.mensaje || 'Movimiento guardado correctamente.',
            'exito'
          );
          formulario.reset();
          llenarSelector(categoria, [], 'Primero selecciona un tipo');
          categoria.disabled = true;
          cuenta.disabled = false;
          establecerFechaActual();
        } catch (error) {
          mostrarMensaje(
            'No pude confirmar el registro. Revisa la hoja antes de intentarlo otra vez. ' +
              error.message,
            'error'
          );
        } finally {
          cambiarEstadoGuardado(false);
        }
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js');
        });
      }
    </script>
  </body>
</html>
