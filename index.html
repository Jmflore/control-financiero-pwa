<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="robots" content="noindex, nofollow">

    <title>Control financiero</title>

    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">

    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #eef2ff;
      }

      #app {
        display: block;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        border: 0;
        background: #eef2ff;
      }

      #cargando {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, #dbeafe 0, transparent 42%),
          radial-gradient(circle at bottom right, #e0e7ff 0, transparent 45%),
          #eef2ff;
        transition: opacity 180ms ease, visibility 180ms ease;
      }

      #cargando.oculto {
        visibility: hidden;
        opacity: 0;
      }

      .cargando-contenido {
        display: grid;
        justify-items: center;
        gap: 14px;
        color: #172033;
        font-weight: 750;
      }

      .logo {
        display: grid;
        width: 86px;
        height: 86px;
        place-items: center;
        border-radius: 25px;
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        color: white;
        font-size: 46px;
        font-weight: 850;
        box-shadow: 0 18px 36px rgba(37, 99, 235, 0.28);
      }

      .puntos {
        display: flex;
        gap: 7px;
      }

      .puntos span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2563eb;
        animation: pulso 900ms infinite alternate;
      }

      .puntos span:nth-child(2) {
        animation-delay: 180ms;
      }

      .puntos span:nth-child(3) {
        animation-delay: 360ms;
      }

      @keyframes pulso {
        from {
          opacity: 0.25;
          transform: translateY(0);
        }

        to {
          opacity: 1;
          transform: translateY(-4px);
        }
      }

      #estadoConexion {
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        left: 50%;
        z-index: 20;
        display: none;
        max-width: calc(100% - 28px);
        padding: 10px 16px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #b42318;
        color: white;
        font-size: 14px;
        font-weight: 750;
        text-align: center;
        box-shadow: 0 8px 20px rgba(180, 35, 24, 0.28);
      }

      #estadoConexion.visible {
        display: block;
      }

      #instalar {
        position: fixed;
        right: 16px;
        bottom: max(16px, env(safe-area-inset-bottom));
        z-index: 20;
        display: none;
        min-height: 50px;
        padding: 0 19px;
        border: 0;
        border-radius: 16px;
        background: #172033;
        color: white;
        font: inherit;
        font-weight: 800;
        box-shadow: 0 12px 28px rgba(23, 32, 51, 0.28);
        cursor: pointer;
      }

      #instalar.visible {
        display: block;
      }

      @media (display-mode: standalone), (display-mode: fullscreen) {
        #instalar {
          display: none !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="cargando" aria-live="polite">
      <div class="cargando-contenido">
        <div class="logo" aria-hidden="true">$</div>
        <div>Abriendo Control financiero</div>
        <div class="puntos" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <div id="estadoConexion">Sin conexión a Internet</div>

    <iframe
      id="app"
      title="Control financiero"
      src="https://script.google.com/a/*/macros/s/AKfycby3YTitBQ3V_uUh2XvdQBF8nhwcnRAwPTgIk4sJa4rtEsz3J1E48mBW_-Jow-ZTaswXDg/exec"
      allow="fullscreen"
    ></iframe>

    <button id="instalar" type="button">Instalar aplicación</button>

    <script>
      const marcoApp = document.getElementById('app');
      const cargando = document.getElementById('cargando');
      const estadoConexion = document.getElementById('estadoConexion');
      const botonInstalar = document.getElementById('instalar');

      let solicitudInstalacion = null;

      marcoApp.addEventListener('load', function () {
        cargando.classList.add('oculto');
      });

      function actualizarConexion() {
        estadoConexion.classList.toggle('visible', !navigator.onLine);
      }

      window.addEventListener('online', actualizarConexion);
      window.addEventListener('offline', actualizarConexion);
      actualizarConexion();

      window.addEventListener('beforeinstallprompt', function (evento) {
        evento.preventDefault();
        solicitudInstalacion = evento;
        botonInstalar.classList.add('visible');
      });

      botonInstalar.addEventListener('click', async function () {
        if (!solicitudInstalacion) {
          return;
        }

        solicitudInstalacion.prompt();
        await solicitudInstalacion.userChoice;
        solicitudInstalacion = null;
        botonInstalar.classList.remove('visible');
      });

      window.addEventListener('appinstalled', function () {
        botonInstalar.classList.remove('visible');
        solicitudInstalacion = null;
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js');
        });
      }
    </script>
  </body>
</html>
